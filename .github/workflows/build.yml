name: Build FNF HD APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Neko and Haxe
        run: |
          sudo apt-get update -y
          sudo apt-get install -y neko haxe
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib

      - name: Install lime and openfl
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet

      - name: Install flixel libraries
        run: |
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install actuate --quiet

      - name: Install other dependencies
        run: |
          haxelib install hscript --quiet
          haxelib install newgrounds --quiet
          haxelib install hxCodec --quiet
          haxelib git linc_luajit https://github.com/jigsaw-4277821/linc_luajit.git --quiet
          haxelib git extension-androidtools https://github.com/MaysLastPlay77/extension-androidtools.git --quiet

      - name: Install Android NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;21.4.7075529" --sdk_root=$ANDROID_HOME

      - name: Configure lime for Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_HOME/ndk/21.4.7075529
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Build APK
        run: haxelib run lime build android -final

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-HD-Android
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
